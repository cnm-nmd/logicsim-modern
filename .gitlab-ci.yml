image: node:22-alpine

stages:
  - test
  - deploy

logic-test:
  stage: test
  script:
    - node --test tests/logic.test.mjs

deploy-pages:
  stage: deploy
  script:
    - mkdir -p public
    - cp index.html style.css README.md .nojekyll public/
    - cp -R src assets legacy public/
  pages:
    publish: public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
